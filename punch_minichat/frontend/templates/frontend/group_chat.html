{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ group.name }}</title>
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
    <h1>{{ group.name }}</h1>

    <!-- Navigation -->
    <button onclick="location.href='{% url 'frontend-group-list' %}'">Back to Groups</button>
    <button onclick="location.href='{% url 'frontend-dashboard' %}'">Dashboard</button>

    <!-- Messages -->
    <ul id="messages">
        <li>Loading messages...</li>
    </ul>

    <!-- Message form -->
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <!-- JS -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const messagesEl = document.getElementById('messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const token = localStorage.getItem('access_token');
        const groupId = "{{ group.id }}"; // Django context variable
        let groupSocket = null;

        function addMessage(sender, text, timestamp) {
            const li = document.createElement('li');
            li.textContent = `${sender}: ${text} (${new Date(timestamp).toLocaleTimeString()})`;
            messagesEl.appendChild(li);
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${window.location.origin}/api/group/${groupId}/messages`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const msgs = await res.json();
                messagesEl.innerHTML = '';
                if(msgs.length === 0){
                    messagesEl.innerHTML = '<li>No messages yet</li>';
                } else {
                    msgs.forEach(msg => addMessage(msg.sender, msg.text, msg.timestamp));
                }
            } catch(err) {
                console.error(err);
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/group/${groupId}/?token=${token}`;
            groupSocket = new WebSocket(wsUrl);

            groupSocket.onopen = () => console.log('Group WebSocket connected');
            groupSocket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                addMessage(data.sender, data.message, data.timestamp);
            };
            groupSocket.onclose = () => console.log('Group WebSocket closed');
            groupSocket.onerror = (e) => console.error('WebSocket error', e);
        }

        messageForm.addEventListener('submit', async e => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if(!text) return;

            if(groupSocket && groupSocket.readyState === WebSocket.OPEN){
                const currentUser = JSON.parse(atob(token.split('.')[1])).username;
                groupSocket.send(JSON.stringify({ message: text }));
                addMessage(currentUser, text, new Date().toISOString());
                messageInput.value = '';
            } else {
                try {
                    const res = await fetch(`${window.location.origin}/api/group/${groupId}/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ message: text })
                    });
                    if(res.ok){
                        messageInput.value = '';
                        loadMessages();
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Failed to send message');
                    }
                } catch(err) {
                    console.error(err);
                }
            }
        });

        loadMessages();
        connectWebSocket();
    });
    </script>
</body>
</html>
