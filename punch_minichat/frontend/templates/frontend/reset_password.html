{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
    <h2>Reset Password</h2>
    <input id="password" type="password" placeholder="New Password" required>
    <input id="confirm" type="password" placeholder="Confirm Password" required>
    <button id="reset-btn">Reset</button>

    <script src="{% static 'frontend/forgot_password.js' %}"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');
        const resetBtn = document.getElementById('reset-btn');
        const API = window.location.origin + '/api'; // base API URL

        resetBtn.addEventListener('click', async () => {
            const password = passwordInput.value.trim();
            const confirm = confirmInput.value.trim();
            const email = localStorage.getItem('reset_email');
            const code = localStorage.getItem('reset_code');

            if (!password || !confirm) return alert('Please fill all fields');
            if (password !== confirm) return alert('Passwords do not match');
            if (!code) return alert('No code found. Please restart the process.');

            try {
                const res = await fetch(`${API}/forget-password/reset/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, password, confirm_password: confirm })
                });

                const result = await res.json();
                if (res.ok) {
                    alert('Password reset successful');
                    window.location.href = '/login';
                } else {
                    alert(result.detail || 'Failed to reset password');
                }
            } catch(err) {
                console.error(err);
                alert('Network error. Try again.');
            }
        });
    });
    </script>
</body>
</html>
