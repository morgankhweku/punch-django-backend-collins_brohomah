{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
    <h1>Forgot Password</h1>

    <div id="step1">
        <h3>Step 1: Request Code</h3>
        <input type="email" id="email" placeholder="Enter your email" required>
        <button id="request-code-btn">Request Code</button>
    </div>

    <div id="step2" style="display:none;">
        <h3>Step 2: Verify Code</h3>
        <input type="text" id="code" placeholder="Enter code" required>
        <button id="verify-code-btn">Verify</button>
    </div>

    <div id="step3" style="display:none;">
        <h3>Step 3: Reset Password</h3>
        <input type="password" id="password" placeholder="New Password" required><br>
        <input type="password" id="confirm_password" placeholder="Confirm Password" required><br>
        <button id="reset-password-btn">Reset Password</button>
    </div>

    <p><a href="{% url 'frontend-login' %}">Back to Login</a></p>

    <!-- Load production-ready auth JS -->
    <script src="{% static 'frontend/js/auth.js' %}"></script>
</body>
</html>
