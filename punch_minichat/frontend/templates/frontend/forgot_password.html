{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
    <h1>Forgot Password</h1>

    <div id="step1">
        <h3>Request Code</h3>
        <input type="email" id="email" placeholder="Enter your email" required>
        <button id="request-code-btn">Request Code</button>
    </div>

    <p><a href="{% url 'frontend-login' %}">Back to Login</a></p>

    <!-- Popup for code -->
    <div id="code-popup" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; border:1px solid #ccc; box-shadow:0 0 10px rgba(0,0,0,0.1);">
        <h3>Your Verification Code</h3>
        <p id="code-display"></p>
        <button id="ok-btn">OK</button>
    </div>

    <!-- Load production-ready auth JS -->
    <script src="{% static 'frontend/js/auth.js' %}"></script>
</body>
</html>
